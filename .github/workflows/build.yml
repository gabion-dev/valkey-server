# .github/workflows/build.yml
name: Build Valkey

on:
  workflow_dispatch:
    inputs:
      valkey_tag:
        description: 'valkey-io/valkey tag to build (e.g. 9.1.2)'
        required: true
        default: '9.1.2'

permissions:
  contents: write

jobs:
  build-linux:
    # Linux binaries are built static against musl (Alpine). A musl-static
    # binary has no runtime NSS dlopen (the latent hole of glibc-static) and
    # runs on ANY Linux host — glibc or musl — with nothing installed. Both
    # arches go through the same Alpine path so no cross-toolchain drift can
    # appear between them.
    strategy:
      matrix:
        include:
          - arch: amd64
            alpine_arch: x86_64
          - arch: arm64
            alpine_arch: aarch64
    runs-on: ubuntu-22.04

    steps:
      - name: Set up QEMU (foreign arch only)
        if: matrix.alpine_arch != 'x86_64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Alpine (musl) build environment
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.alpine_arch }}
          packages: build-base linux-headers pkgconf git bash

      - name: Clone and build (static musl)
        shell: alpine.sh {0}
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.valkey_tag }} https://github.com/valkey-io/valkey.git
          cd valkey
          # valkey's Makefile appends -rdynamic to the final link flags for
          # loadable-module symbol resolution. -rdynamic forces a dynamic
          # executable and silently defeats -static. We load no modules, so
          # strip -rdynamic to get a truly static binary.
          sed -i 's/-rdynamic//g' src/Makefile
          # -no-pie alongside -static: Alpine's gcc defaults to PIE, and the
          # implicit -pie overrides -static (yielding a dynamic PIE against
          # ld-musl). -no-pie removes that conflict so -static produces a
          # classic, fully static binary. V=1 prints the real link command.
          make -j"$(nproc)" V=1 \
            MALLOC=libc \
            BUILD_TLS=no \
            LDFLAGS="-static -no-pie" \
            noopt="" \
            valkey-server
          # Fail loudly if the result is not actually static: a dynamic
          # binary would silently reintroduce the host-library dependency
          # this whole build exists to remove. A static binary references
          # no .so; any .so line means the link was not static.
          if ldd src/valkey-server 2>&1 | grep -q '\.so'; then
            echo "ERROR: valkey-server is dynamically linked (expected static)" >&2
            ldd src/valkey-server >&2 || true
            exit 1
          fi

      - name: Prepare binary
        shell: alpine.sh {0}
        run: |
          FILENAME="valkey-server-linux-${{ matrix.arch }}"
          cp valkey/src/valkey-server "${FILENAME}"
          chmod 755 "${FILENAME}"
          sha256sum "${FILENAME}" > "${FILENAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: valkey-server-linux-${{ matrix.arch }}
          path: |
            valkey-server-linux-${{ matrix.arch }}
            valkey-server-linux-${{ matrix.arch }}.sha256

  build-macos:
    # macOS is self-contained by design: binaries link against libSystem,
    # which is always present. No static linking (Apple ships no static
    # libc) and none is needed.
    strategy:
      matrix:
        include:
          - arch: amd64
            extra_cflags: "-arch x86_64"
            extra_ldflags: "-arch x86_64"
          - arch: arm64
            extra_cflags: ""
            extra_ldflags: ""
    runs-on: macos-14

    steps:
      - name: Clone valkey-io/valkey
        run: git clone --depth 1 --branch ${{ github.event.inputs.valkey_tag }} https://github.com/valkey-io/valkey.git

      - name: Build
        run: |
          cd valkey
          make -j"$(sysctl -n hw.ncpu)" \
            MALLOC=libc \
            BUILD_TLS=no \
            CFLAGS="${{ matrix.extra_cflags }}" \
            LDFLAGS="${{ matrix.extra_ldflags }}" \
            noopt="" \
            valkey-server

      - name: Prepare binary
        run: |
          FILENAME="valkey-server-darwin-${{ matrix.arch }}"
          cp valkey/src/valkey-server "${FILENAME}"
          chmod 755 "${FILENAME}"
          shasum -a 256 "${FILENAME}" > "${FILENAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: valkey-server-darwin-${{ matrix.arch }}
          path: |
            valkey-server-darwin-${{ matrix.arch }}
            valkey-server-darwin-${{ matrix.arch }}.sha256

  # The launch guard: every binary is started on a machine of its own
  # architecture and must report the tag it was built from. A file that
  # exists proves nothing, and the arm64 Linux build runs under QEMU, where
  # a check proves nothing either — so verification is a separate job on
  # native runners, and the release waits for all of them.
  verify:
    needs: [build-linux, build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: valkey-server-linux-amd64
            runner: ubuntu-24.04
          - file: valkey-server-linux-arm64
            runner: ubuntu-24.04-arm
          - file: valkey-server-darwin-arm64
            runner: macos-26
          - file: valkey-server-darwin-arm64
            runner: macos-15
          - file: valkey-server-darwin-amd64
            runner: macos-26-intel
          - file: valkey-server-darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.file }}

      - name: Start it and read its version
        run: |
          set -euo pipefail
          chmod 755 "${{ matrix.file }}"
          OUT="$(./${{ matrix.file }} --version)"
          echo "${OUT}"
          echo "${OUT}" | grep -q "v=${{ github.event.inputs.valkey_tag }} "
          if [ "$(uname -s)" = "Linux" ] && ldd "${{ matrix.file }}" 2>&1 | grep -q '\.so'; then
            echo "ERROR: ${{ matrix.file }} is dynamically linked (expected static)" >&2
            exit 1
          fi

      # Gabion's rate limiter (bucket4j over Lettuce) runs its
      # compare-and-swap as a Lua script, and since 9.1 Lua is a separate
      # module of the build — so the guard runs one. Arguments and the
      # readiness line are the ones Gabion's dev process uses.
      - name: Serve and run a Lua script
        run: |
          set -euo pipefail
          PORT=46379
          ./${{ matrix.file }} --port "${PORT}" --set-proc-title no --bind 127.0.0.1 \
            --protected-mode yes --save "" --appendonly no --loglevel notice > server.log 2>&1 &
          PID=$!
          for _ in $(seq 1 100); do
            grep -q "Ready to accept connections" server.log && break
            kill -0 "${PID}" || { cat server.log; exit 1; }
            sleep 0.1
          done
          grep -q "Ready to accept connections" server.log || { cat server.log; exit 1; }
          REPLY="$(printf '*3\r\n$4\r\nEVAL\r\n$8\r\nreturn 7\r\n$1\r\n0\r\n' | nc -w 2 127.0.0.1 "${PORT}" | tr -d '\r')"
          kill "${PID}"
          echo "EVAL reply: ${REPLY}"
          [ "${REPLY}" = ":7" ]

  release:
    needs: [verify]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Valkey is BSD-3-Clause software, and the license asks for its notice
      # in binary distributions too: the release carries the upstream license
      # text (the COPYING file of the tag the binaries were built from).
      - name: Fetch the Valkey license text
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/valkey-io/valkey/${{ github.event.inputs.valkey_tag }}/COPYING" -o LICENSE
          grep -q "Redistribution and use in source and binary forms" LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.valkey_tag }}
          name: Valkey ${{ github.event.inputs.valkey_tag }}
          body: |
            Pre-built Valkey server binaries from [valkey-io/valkey](https://github.com/valkey-io/valkey) tag `${{ github.event.inputs.valkey_tag }}`.

            Linux binaries are statically linked against musl: they run on any
            Linux host (glibc or musl) with no system libraries installed.
            macOS binaries link against libSystem (always present).

            ## Platforms
            - `valkey-server-linux-amd64` — Linux x64 (static, musl)
            - `valkey-server-linux-arm64` — Linux ARM64 (static, musl)
            - `valkey-server-darwin-amd64` — macOS x64 (Intel)
            - `valkey-server-darwin-arm64` — macOS ARM64 (Apple Silicon)

            Windows is not supported — Valkey does not compile for Windows.

            ## Source
            Built from: https://github.com/valkey-io/valkey/tree/${{ github.event.inputs.valkey_tag }}

            ## License
            BSD 3-Clause License — the upstream text is the `LICENSE` asset.
          files: |
            valkey-server-*
            LICENSE