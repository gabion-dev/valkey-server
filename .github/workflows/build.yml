# .github/workflows/build.yml
name: Build Valkey

on:
  workflow_dispatch:
    inputs:
      valkey_tag:
        description: 'valkey-io/valkey tag to build (e.g. 9.1.2)'
        required: true
        default: '9.1.2'

permissions:
  contents: write

jobs:
  build-linux:
    # Linux binaries link the host's glibc dynamically and nothing else, and
    # are built on the oldest base Gabion supports: glibc is backward
    # compatible only, so a binary built against glibc 2.35 runs on every
    # newer distribution (the manylinux practice, PEP 600). A fully static
    # musl build is not possible since 9.1: the Lua engine is a module, and
    # the server finds even the built-in one through dlopen(NULL) + dlsym,
    # which a static musl binary does not have. Ubuntu 22.04 (glibc 2.35) is
    # the floor Gabion already requires for its Asterisk tree, so an older
    # base would widen nothing. Both arches build on native runners.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Clone and build
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.inputs.valkey_tag }}" https://github.com/valkey-io/valkey.git
          cd valkey
          # valkey-cli is built for the launch guard only, never released.
          make -j"$(nproc)" MALLOC=libc BUILD_TLS=no valkey-server valkey-cli

      # What the binary asks of the host is exactly what the installer checks
      # before downloading it: no library beyond glibc's libc and libm, no
      # symbol version newer than the floor. The Lua engine's entry point
      # must stay exported, or the server cannot find it at start.
      - name: Check what the binary needs from the host
        run: |
          set -euo pipefail
          BIN=valkey/src/valkey-server
          NEEDED="$(readelf -d "${BIN}" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')"
          echo "NEEDED: ${NEEDED}"
          [ "${NEEDED}" = "libc.so.6 libm.so.6 " ] || { echo "ERROR: unexpected library dependencies" >&2; exit 1; }
          NEWEST="$(objdump -T "${BIN}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV | tail -1)"
          echo "Newest glibc symbol version: ${NEWEST}"
          [ "$(printf '%s\nGLIBC_2.35\n' "${NEWEST}" | sort -V | tail -1)" = "GLIBC_2.35" ] \
            || { echo "ERROR: ${NEWEST} is newer than the GLIBC_2.35 floor" >&2; exit 1; }
          # Counted, not grep -q: under pipefail an early-exiting grep would
          # fail the pipeline through nm's SIGPIPE.
          [ "$(nm -D "${BIN}" | grep -c ' ValkeyModule_OnLoad_lua$')" = "1" ] \
            || { echo "ERROR: the Lua engine entry point is not exported" >&2; exit 1; }
          echo "Symbol versions per library (pinned by the installer):"
          readelf -V "${BIN}" | awk '/Version needs section/,0'

      - name: Prepare binaries
        run: |
          set -euo pipefail
          FILENAME="valkey-server-linux-${{ matrix.arch }}"
          cp valkey/src/valkey-server "${FILENAME}"
          cp valkey/src/valkey-cli "valkey-cli-linux-${{ matrix.arch }}"
          chmod 755 "${FILENAME}" "valkey-cli-linux-${{ matrix.arch }}"
          sha256sum "${FILENAME}" > "${FILENAME}.sha256"

      - name: Upload the server
        uses: actions/upload-artifact@v7
        with:
          name: valkey-server-linux-${{ matrix.arch }}
          path: |
            valkey-server-linux-${{ matrix.arch }}
            valkey-server-linux-${{ matrix.arch }}.sha256

      - name: Upload the client (guard only)
        uses: actions/upload-artifact@v7
        with:
          name: valkey-cli-linux-${{ matrix.arch }}
          path: valkey-cli-linux-${{ matrix.arch }}

  build-macos:
    # macOS is self-contained by design: binaries link against libSystem,
    # which is always present. No static linking (Apple ships no static
    # libc) and none is needed.
    strategy:
      matrix:
        include:
          - arch: amd64
            extra_cflags: "-arch x86_64"
            extra_ldflags: "-arch x86_64"
          - arch: arm64
            extra_cflags: ""
            extra_ldflags: ""
    runs-on: macos-14

    steps:
      - name: Clone valkey-io/valkey
        run: git clone --depth 1 --branch ${{ github.event.inputs.valkey_tag }} https://github.com/valkey-io/valkey.git

      # macOS 13 is the oldest macOS Gabion installs on (the same floor its
      # telephony engines check); without a deployment target the binary
      # would require the build runner's own macOS.
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          cd valkey
          make -j"$(sysctl -n hw.ncpu)" \
            MALLOC=libc \
            BUILD_TLS=no \
            CFLAGS="${{ matrix.extra_cflags }}" \
            LDFLAGS="${{ matrix.extra_ldflags }}" \
            noopt="" \
            valkey-server

      - name: Prepare binary
        run: |
          FILENAME="valkey-server-darwin-${{ matrix.arch }}"
          cp valkey/src/valkey-server "${FILENAME}"
          chmod 755 "${FILENAME}"
          shasum -a 256 "${FILENAME}" > "${FILENAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: valkey-server-darwin-${{ matrix.arch }}
          path: |
            valkey-server-darwin-${{ matrix.arch }}
            valkey-server-darwin-${{ matrix.arch }}.sha256

  # The launch guard: every binary is started on a machine of its own
  # architecture, must report the tag it was built from, serve on localhost
  # with the arguments Gabion's dev process uses and run a Lua script —
  # Gabion's rate limiter (bucket4j over Lettuce) runs its compare-and-swap
  # as one, and since 9.1 Lua is a module of the build. Linux binaries run
  # inside clean containers of the oldest and newest distributions Gabion
  # meets, each with nothing installed; macOS on the two newest releases.
  verify-linux:
    needs: [build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            images: "ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 rockylinux/rockylinux:9 fedora:latest amazonlinux:2023 archlinux:latest"
          - arch: arm64
            runner: ubuntu-24.04-arm
            images: "ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 rockylinux/rockylinux:9 fedora:latest amazonlinux:2023"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download the server and the client
        uses: actions/download-artifact@v8
        with:
          pattern: valkey-*-linux-${{ matrix.arch }}
          merge-multiple: true

      - name: Serve and run a Lua script on every distribution
        run: |
          set -euo pipefail
          mkdir t
          cp "valkey-server-linux-${{ matrix.arch }}" t/valkey-server
          cp "valkey-cli-linux-${{ matrix.arch }}" t/valkey-cli
          chmod 755 t/valkey-server t/valkey-cli
          cat > t/run.sh <<'EOF'
          set -eu
          cd /t
          ./valkey-server --version | grep -q "v=$1 "
          ./valkey-server --port 46379 --set-proc-title no --bind 127.0.0.1 \
            --protected-mode yes --save "" --appendonly no --loglevel notice > /tmp/server.log 2>&1 &
          for _ in $(seq 1 100); do
            grep -q "Ready to accept connections" /tmp/server.log && break
            sleep 0.1
          done
          grep -q "Ready to accept connections" /tmp/server.log || { cat /tmp/server.log; exit 1; }
          REPLY="$(./valkey-cli -p 46379 EVAL "return 7" 0)"
          echo "EVAL reply: ${REPLY}"
          [ "${REPLY}" = "7" ]
          EOF
          for IMAGE in ${{ matrix.images }}; do
            echo "::group::${IMAGE}"
            docker run --rm -v "${PWD}/t:/t:ro" "${IMAGE}" sh /t/run.sh "${{ github.event.inputs.valkey_tag }}"
            echo "::endgroup::"
          done

  verify-macos:
    needs: [build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: valkey-server-darwin-arm64
            runner: macos-26
          - file: valkey-server-darwin-arm64
            runner: macos-15
          - file: valkey-server-darwin-amd64
            runner: macos-26-intel
          - file: valkey-server-darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.file }}

      - name: Serve and run a Lua script
        run: |
          set -euo pipefail
          chmod 755 "${{ matrix.file }}"
          VERSION="$(./${{ matrix.file }} --version)"
          echo "${VERSION}"
          case "${VERSION}" in *"v=${{ github.event.inputs.valkey_tag }} "*) ;; *) exit 1 ;; esac
          PORT=46379
          ./${{ matrix.file }} --port "${PORT}" --set-proc-title no --bind 127.0.0.1 \
            --protected-mode yes --save "" --appendonly no --loglevel notice > server.log 2>&1 &
          PID=$!
          for _ in $(seq 1 100); do
            grep -q "Ready to accept connections" server.log && break
            kill -0 "${PID}" || { cat server.log; exit 1; }
            sleep 0.1
          done
          grep -q "Ready to accept connections" server.log || { cat server.log; exit 1; }
          REPLY="$(printf '*3\r\n$4\r\nEVAL\r\n$8\r\nreturn 7\r\n$1\r\n0\r\n' | nc -w 2 127.0.0.1 "${PORT}" | tr -d '\r')"
          kill "${PID}"
          echo "EVAL reply: ${REPLY}"
          [ "${REPLY}" = ":7" ]

  release:
    needs: [verify-linux, verify-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download the servers
        uses: actions/download-artifact@v8
        with:
          pattern: valkey-server-*
          merge-multiple: true

      # Valkey is BSD-3-Clause software, and the license asks for its notice
      # in binary distributions too: the release carries the upstream license
      # text (the COPYING file of the tag the binaries were built from).
      - name: Fetch the Valkey license text
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/valkey-io/valkey/${{ github.event.inputs.valkey_tag }}/COPYING" -o LICENSE
          grep -q "Redistribution and use in source and binary forms" LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.valkey_tag }}
          name: Valkey ${{ github.event.inputs.valkey_tag }}
          body: |
            Pre-built Valkey server binaries from [valkey-io/valkey](https://github.com/valkey-io/valkey) tag `${{ github.event.inputs.valkey_tag }}`.

            Linux binaries are built on Ubuntu 22.04 and need only glibc 2.35 or
            newer (libc and libm) from the host: they run on any glibc
            distribution of that age or newer with nothing else installed.
            musl distributions (Alpine) are not supported.
            macOS binaries link against libSystem (always present) and need
            macOS 13 or newer.

            ## Platforms
            - `valkey-server-linux-amd64` — Linux x64 (glibc 2.35+)
            - `valkey-server-linux-arm64` — Linux ARM64 (glibc 2.35+)
            - `valkey-server-darwin-amd64` — macOS x64 (Intel)
            - `valkey-server-darwin-arm64` — macOS ARM64 (Apple Silicon)

            Windows is not supported — Valkey does not compile for Windows.

            ## Source
            Built from: https://github.com/valkey-io/valkey/tree/${{ github.event.inputs.valkey_tag }}

            ## License
            BSD 3-Clause License — the upstream text is the `LICENSE` asset.
          files: |
            valkey-server-*
            LICENSE